name: foodtrace

services:
  frontend:
    build: ./frontend
    container_name: foodtrace-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: foodtrace-backend
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - /app/node_modules
